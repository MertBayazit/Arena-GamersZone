version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena_gamerszone_app
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://db:27017/gamerszone
      - JWT_SECRET=change_this_to_a_secure_random_key_in_production
      # - GOOGLE_CLIENT_ID=your_google_client_id
      # - GOOGLE_CLIENT_SECRET=your_google_client_secret
      # - CLIENT_URL=http://localhost:5000
    depends_on:
      - db
    restart: always

  db:
    image: mongo:6.0
    container_name: arena_gamerszone_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: always

volumes:
  mongo_data:
